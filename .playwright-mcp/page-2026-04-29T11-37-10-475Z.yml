                        - 'heading "NSC22 The Learner in the Loop: How Artificial Intelligence Is Changing Pulmonary and Critical Care Education" [level=6] [ref=e529]'
                        - paragraph [ref=e532]: Other Topics
                        - paragraph [ref=e533]: Artificial intelligence is rapidly reshaping how pulmonary and critical care clinicians are trained, shifting education from standardized models toward adaptive, learner-centered approaches. This session explores how AI can individualize learning pathways, augment procedural training through real-time feedback, and redefine competency assessment. Faculty will also address critical considerations around psychological safety, equity, and learner agency in AI-enabled environments. Through practical examples and forward-looking insights, attendees will gain a framework for integrating AI into education while preserving the human elements essential to effective training and professional identity formation.
                        - generic [ref=e535]:
